server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths are handled by the React router, not by nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so they can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise a deploy keeps serving stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
